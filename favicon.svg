<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#fbbf24" stroke-width="2.5" />
  <!-- Traditional Vietnamese Scholar Hat (Mũ Cánh Chuồn) / Golden Winged Cap -->
  <!-- Wings -->
  <path d="M 6 32 C 6 27, 18 28, 26 31 C 26 34, 16 35, 6 32 Z" fill="url(#gold)" opacity="0.95" />
  <path d="M 58 32 C 58 27, 46 28, 38 31 C 38 34, 48 35, 58 32 Z" fill="url(#gold)" opacity="0.95" />
  <!-- Hat Dome -->
  <path d="M 23 35 C 23 20, 41 20, 41 35 Z" fill="#991b1b" stroke="url(#gold)" stroke-width="1.5" />
  <!-- Crown Band -->
  <path d="M 21 33 C 21 31, 43 31, 43 33 L 44 38 C 44 40, 20 40, 20 38 Z" fill="url(#gold)" />
  <!-- Red Ruby Jewel in center of hat -->
  <circle cx="32" cy="35" r="2" fill="#ef4444" stroke="#fef08a" stroke-width="0.8" />
  <!-- Golden Scholar Ribbon -->
  <path d="M 28 39 L 26 49 L 30 46 L 32 49 L 32 39 Z" fill="#fbbf24" />
  <path d="M 36 39 L 38 49 L 34 46 L 32 49 L 32 39 Z" fill="#d97706" />
  <!-- Sparkling Star -->
  <polygon points="32,15 33.5,19 38,19 34.5,21.5 36,26 32,23 28,26 29.5,21.5 26,19 30.5,19" fill="#fef08a" stroke="#d97706" stroke-width="0.5" />
</svg>
